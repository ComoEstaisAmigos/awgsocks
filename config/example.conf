# AWGSocks - example AmneziaWG client configuration
#
# This is the .conf file your AmneziaWG server produced. AWGSocks reads it with
# the same parser the official AmneziaWG Windows client uses and reinterprets
# nothing.
#
# IMPORTANT: the keys below are placeholders and are not valid. Use the file
# your own server generated.
#
# AllowedIPs = 0.0.0.0/0, ::/0 is accepted, but AWGSocks NEVER writes it to the
# Windows routing table. The value only states which destinations the AmneziaWG
# peer is allowed to carry.

[Interface]
PrivateKey = kDgLGlIv7Vxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx=
Address = 10.66.66.2/32,fd42:42:42::2/128
DNS = 1.1.1.1,1.0.0.1

# --- AmneziaWG junk packets ---
# Jc  : how many random junk packets to send before a handshake (0 disables)
# Jmin: minimum junk packet size
# Jmax: maximum junk packet size
Jc = 10
Jmin = 50
Jmax = 1000

# --- AmneziaWG random prefixes (uint16, 0 disables) ---
# S1: handshake initiation packet
# S2: handshake response packet
# S3: cookie reply packet
# S4: transport (data) packet
#
# Note that S4 is added to EVERY data packet, so it eats into the usable MTU.
# AWGSocks derives a safe MTU from it automatically unless you set MTU below.
S1 = 150
S2 = 135
S3 = 107
S4 = 43

# --- AmneziaWG custom message type identifiers (range<uint32>) ---
# Format: a single value "a" or an inclusive range "a-b".
# For each outgoing packet a random value is chosen from the range, and on
# reception any value inside the range is accepted.
# The four ranges must not overlap.
H1 = 301745575-401745574
H2 = 876826554-976826553
H3 = 1337755454-1437755454
H4 = 1776593183-1876593183

# --- MTU (optional) ---
# Leave this out and AWGSocks derives 1420 - S4 - ContentPaddingAddition.
# The derivation cancels S4 out, so over an IPv4 endpoint the packet on the wire
# is always 1420 + 32 + 8 + 20 = 1480 bytes whatever S4 is, which fits a 1492
# byte PPPoE path as well as a 1500 byte one.
#
# An IPv6 endpoint costs 20 bytes more and lands on exactly 1500, so set MTU
# explicitly if your path is narrower than that. Subtract the shortfall from the
# derived value: on a 1492 byte path that is 1500 - 1492 = 8, and the derived
# value here is 1420 - 43 = 1377, so:
#
# MTU = 1369

# --- AmneziaWG 2.0 / 3.x parameters (optional) ---
# If your server generates these, keep them exactly as they are. If it does not,
# do not add them: enabling a new parameter on an old configuration breaks the
# connection.
#
# I1 = <b 0xc0a80101><c 4><r 16>
# I2 =
# I3 =
# I4 =
# I5 =
# HeaderProtectionKey = <base64, 32 bytes>
# ContentPaddingAddition = 0-100
# RekeyAfterTime = 110-130
# RekeyTimeout = 4-6
# RejectAfterTime = 170-190
# KeepaliveTimeout = 8-12
# MaxHandshakeAttempts = 15-20
# RandomTrailers = off
# DisableCookies = off

[Peer]
PublicKey = cu7q95KZxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx=
PresharedKey = z+0pxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx=
Endpoint = 203.0.113.10:54522
AllowedIPs = 0.0.0.0/0,::/0

# PersistentKeepalive keeps the tunnel alive behind NAT.
# PersistentKeepalive = 25
